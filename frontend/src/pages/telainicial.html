<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardião</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/telainicial.css">
</head>
<body>

  <!-- DECORAÇÕES DE FUNDO -->
  <div class="bg-deco" aria-hidden="true">
    <img src="../img/abstratosuperior.png"  class="deco-superior"   alt="">
    <img src="../img/abstrato inferior.png" class="deco-inferior"   alt="">
    <img src="../img/abstratoesquerda.png"  class="deco-esquerda"   alt="">
    <img src="../img/abstratodireita.png"   class="deco-direita"    alt="">
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="pagina">

    <!-- LADO ESQUERDO: mascotes -->
    <div class="lado-mascote">
      <img src="../img/mascotespulando.png" alt="Mascotes do Guardião" class="mascote-img">
    </div>

    <!-- LADO DIREITO: card branco -->
    <div class="lado-card">

     <h1 class="titulo-guardiao" aria-label="Guardião. Juntos contra golpes.">
  <svg viewBox="0 0 400 150" class="titulo-svg" aria-hidden="true">
    <defs>
      <path id="curva-titulo"  d="M 10,100 Q 200,0 390,100" />
      <path id="curva-slogan"  d="M 40,130 Q 200,40 360,130" />
    </defs>

    <text class="t-titulo">
      <textPath href="#curva-titulo" startOffset="50%" text-anchor="middle">
        Guardião
      </textPath>
    </text>

    <text class="t-slogan">
      <textPath href="#curva-slogan" startOffset="50%" text-anchor="middle">
        Juntos contra golpes.
      </textPath>
    </text>
  </svg>
</h1>

      <div class="card-principal">

        <!-- Subtítulo -->
        <div class="card-titulo">
          <p class="subtitulo">Sua segurança, em boas mãos.
        </div>

        <!-- Botão 1: Acessar o Guardião -->
        <a href="login.html" class="btn-acesso">
          <span class="btn-icone">
            <img src="../img/escudoinicial.png" alt="">
          </span>
          <span class="btn-texto">
            <strong>Acessar o Guardião</strong>
            <small>Proteja-se contra golpes.</small>
          </span>
        </a>

        <!-- Botão 2: Acessar o BB Decision -->
        <a href="login.html" class="btn-acesso btn-decision">
          <span class="btn-icone">
            <img src="../img/escudoinicial.png" alt="">
          </span>
          <span class="btn-texto">
            <strong>Acessar o BB Decision</strong>
            <small>Simule, aprenda e tome melhores decisões.</small>
          </span>
        </a>

        <!-- Rodapé -->
        <p class="rodape-card">
          Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>

      </div>
    </div>

  </main>

  <script src="../js/chatbot.js" defer></script>
</body>
</html>

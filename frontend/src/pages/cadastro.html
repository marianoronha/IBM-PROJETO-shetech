<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro — Guardião</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/cadastro.css">
</head>
<body>

  <!-- DECORAÇÕES DE FUNDO -->
  <div class="bg-deco" aria-hidden="true">
    <img src="../img/abstratolateral.png" class="deco-lateral" alt="">
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="pagina">

    <!-- LADO ESQUERDO: formulário de cadastro -->
    <div class="lado-form">

      <!-- Badge + Título fora do card -->
      <div class="titulo-wrap">
        <span class="badge-guardiao">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Guardião
        </span>
        <h1 class="titulo-guardiao"><em>C</em>adastro</h1>
      </div>

      <div class="card-principal">

        <!-- Subtítulo -->
        <div class="card-subtitulo">
          <p class="subtitulo">Crie sua conta no Guardião.<br><span>Rápido, seguro e gratuito.</span></p>
        </div>

        <hr class="divisor">

        <!-- Formulário -->
        <form action="login.html" method="get" autocomplete="off">

          <!-- Seção: Dados pessoais -->
          <p class="secao-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            Dados pessoais
          </p>

          <!-- Nome e Sobrenome -->
          <div class="form-row">
            <div class="campo">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            <div class="campo">
              <label for="sobrenome">Sobrenome</label>
              <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome" required>
            </div>
          </div>

          <!-- E-mail -->
          <div class="form-row" style="margin-top:10px;">
            <div class="campo full">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="voce@email.com" required>
            </div>
          </div>

          <!-- CPF e Data de nascimento -->
          <div class="form-row" style="margin-top:10px;">
            <div class="campo">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
            </div>
            <div class="campo">
              <label for="nascimento">Nascimento</label>
              <input type="date" id="nascimento" name="nascimento" required>
            </div>
          </div>

          <!-- Seção: Conta -->
          <p class="secao-label" style="margin-top:10px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Acesso
          </p>

          <!-- Telefone e Perfil -->
          <div class="form-row">
            <div class="campo">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15">
            </div>
            <div class="campo">
              <label for="perfil">Perfil</label>
              <select id="perfil" name="perfil" required>
                <option value="" disabled selected>Selecione</option>
                <option value="usuario">Usuário</option>
                <option value="gerente">Gerente</option>
                <option value="analista">Analista</option>
              </select>
            </div>
          </div>

          <!-- Senha -->
          <div class="form-row" style="margin-top:10px;">
            <div class="campo full">
              <label for="senha">Senha</label>
              <div class="senha-wrap">
                <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required
                       oninput="avaliarSenha(this.value)">
                <button type="button" class="senha-toggle" onclick="toggleSenha()" aria-label="Mostrar senha">
                  <svg id="icon-olho" width="18" height="18" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <!-- Indicador de força -->
              <div class="forca-senha" id="forca-senha" style="display:none;">
                <div class="forca-barras">
                  <div class="forca-barra" id="b1"></div>
                  <div class="forca-barra" id="b2"></div>
                  <div class="forca-barra" id="b3"></div>
                  <div class="forca-barra" id="b4"></div>
                </div>
                <span class="forca-label" id="forca-label"></span>
              </div>
            </div>
          </div>

          <!-- Termos -->
          <label class="termos" style="margin-top:4px;">
            <input type="checkbox" required>
            Li e concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> do Guardião.
          </label>

          <!-- Botão -->
          <button type="submit" class="btn-cadastrar" style="margin-top:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
            Criar minha conta
          </button>

        </form>

        <!-- Rodapé -->
        <p class="rodape-card">
          Já tem conta? <a href="login.html">Faça login</a>
        </p>

      </div>
    </div>

    <!-- LADO DIREITO: mascote -->
    <div class="lado-mascote">
      <img src="../img/mascotespensando.png" alt="Mascote do Guardião" class="mascote-img">
    </div>

  </main>

  <script>
    function avaliarSenha(v) {
      const wrap = document.getElementById('forca-senha');
      const label = document.getElementById('forca-label');
      const barras = [document.getElementById('b1'), document.getElementById('b2'),
                      document.getElementById('b3'), document.getElementById('b4')];

      if (!v) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'flex';

      let pts = 0;
      if (v.length >= 8)              pts++;
      if (/[A-Z]/.test(v))            pts++;
      if (/[0-9]/.test(v))            pts++;
      if (/[^A-Za-z0-9]/.test(v))     pts++;

      const classes = ['fraca','fraca','media','forte'];
      const labels  = ['Fraca','Fraca','Média','Forte'];

      barras.forEach((b, i) => {
        b.className = 'forca-barra' + (i < pts ? ' ' + classes[pts - 1] : '');
      });
      label.textContent = labels[pts - 1] || '';
    }

    function toggleSenha() {
      const input = document.getElementById('senha');
      const icone = document.getElementById('icon-olho');
      const visivel = input.type === 'text';
      input.type = visivel ? 'password' : 'text';
      icone.innerHTML = visivel
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    }

    /* Máscara CPF */
    document.getElementById('cpf').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/,        '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/,               '$1.$2');
      this.value = v;
    });

    /* Máscara Telefone */
    document.getElementById('telefone').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 6)      v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/,        '($1) $2');
      else if (v.length > 0) v = v.replace(/(\d{0,2})/,               '($1');
      this.value = v;
    });
  </script>

</body>
</html>

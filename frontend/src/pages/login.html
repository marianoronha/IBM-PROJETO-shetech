<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Guardião</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

  <!-- DECORAÇÕES DE FUNDO -->
  <div class="bg-deco" aria-hidden="true">
    <img src="../img/abstratoesquerda.png" class="deco-esquerda" alt="">
    <img src="../img/abstratodireita.png"  class="deco-direita"  alt="">
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="pagina">

    <!-- FORMULÁRIO DE LOGIN -->
    <div class="lado-form">

      <!-- Badge + Título -->
      <div class="titulo-wrap">
        <span class="badge-guardiao">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Guardião
        </span>
        <h1 class="titulo-guardiao"><em>L</em>ogin</h1>
      </div>

      <!-- Card -->
      <div class="card-principal">

        <!-- Mascotes escondidos em cima do card -->
        <div class="mascotes-topo" aria-hidden="true">
          <img src="../img/mascotesescondidos.png" alt="">
        </div>

        <div class="card-subtitulo">
          <p class="subtitulo">Bem-vindo de volta.<br><span>Acesse sua conta para continuar.</span></p>
        </div>

        <hr class="divisor">

        <form action="#" method="post" autocomplete="on">

          <!-- E-mail -->
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" required autofocus>
          </div>

          <!-- Senha -->
          <div class="campo" style="margin-top:12px;">
            <div class="label-row">
              <label for="senha">Senha</label>
              <a href="#" class="link-esqueci">Esqueci minha senha</a>
            </div>
            <div class="senha-wrap">
              <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
              <button type="button" class="senha-toggle" onclick="toggleSenha()" aria-label="Mostrar senha">
                <svg id="icon-olho" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Lembrar -->
          <label class="lembrar" style="margin-top:12px;">
            <input type="checkbox" name="lembrar">
            Manter-me conectado
          </label>

          <!-- Botão -->
          <button type="submit" class="btn-entrar" style="margin-top:16px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Entrar
          </button>

        </form>

        <!-- Divisor social -->
        <div class="divisor-ou">
          <hr class="divisor"><span>ou</span><hr class="divisor">
        </div>

        <!-- Acesso rápido BB -->
        <a href="#" class="btn-bb">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Acessar pelo Banco do Brasil
        </a>

        <!-- Rodapé -->
        <p class="rodape-card">
          Não tem conta? <a href="cadastro.html">Cadastre-se grátis</a>
        </p>

      </div>
    </div>

  </main>

  <script>
    function toggleSenha() {
      const input = document.getElementById('senha');
      const icone = document.getElementById('icon-olho');
      const visivel = input.type === 'text';
      input.type = visivel ? 'password' : 'text';
      icone.innerHTML = visivel
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    }
  </script>

</body>
</html>

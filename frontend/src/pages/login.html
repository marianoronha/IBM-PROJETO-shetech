<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Guardião</title>
  <link rel="icon" type="image/png" href="../img/logobdb.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

  <!-- HEADER -->
  <header class="topo">
    <div class="container topo__inner">
      <a href="telainicial-recuperada.html" class="topo__marca" aria-label="Guardião">
        <img src="../img/logobdb.png" alt="Banco do Brasil" class="topo__logo-bb">
        <span>Guardião<i class="topo__dot"></i></span>
      </a>
    </div>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <main class="pagina">

    <!-- LADO ESQUERDO: painel azul com degradê -->
    <div class="painel-azul" aria-hidden="true">
      <img src="../img/fundoazuldegrade.png" alt="" class="painel-azul__bg">
      <div class="painel-azul__conteudo">
        <span class="painel-azul__eyebrow">LOGIN</span>
        <h2 class="painel-azul__titulo">Bem-vindo<br>de <span>volta</span></h2>
        <p class="painel-azul__sub">Acesse sua conta para continuar usando os recursos de segurança do Guardião.</p>
      </div>
    </div>

    <!-- LADO DIREITO: formulário centralizado -->
    <div class="painel-form">

      <div class="form-cabecalho">
        <h1>Acessar conta</h1>
        <p>Entre com seu e-mail e senha.</p>
      </div>

      <form id="form-login" action="#" method="post" autocomplete="on" onsubmit="fazerLogin(event)">

        <!-- E-mail -->
        <div class="campo-grupo">
          <div class="campo">
            <div class="input-wrap">
              <svg class="input-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input type="email" id="email" name="email" placeholder="E-mail" required autofocus autocomplete="email">
            </div>
          </div>

          <div class="campo">
            <div class="input-wrap">
              <svg class="input-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password">
              <button type="button" class="senha-toggle" onclick="toggleSenha()" aria-label="Mostrar senha">
                <svg id="icon-olho" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Lembrar + esqueci -->
        <div class="form-opcoes">
          <label class="lembrar">
            <input type="checkbox" name="lembrar">
            Manter-me conectado
          </label>
          <a href="#" class="link-esqueci">Esqueci minha senha</a>
        </div>

        <!-- Botão entrar -->
        <button type="submit" class="btn-entrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Entrar
        </button>

        <!-- Divisor -->
        <div class="divisor-ou">
          <span></span><span class="divisor-ou__texto">ou</span><span></span>
        </div>

        <!-- Acesso pelo BB -->
        <a href="#" class="btn-bb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Acessar pelo Banco do Brasil
        </a>

      </form>

      <p class="rodape-form">Não tem conta? <a href="cadastro.html">Cadastre-se grátis</a></p>
    </div>

  </main>


  <script>
    /* Mostra feedback de cadastro concluído */
    if (sessionStorage.getItem('cadastro_ok') === '1') {
      sessionStorage.removeItem('cadastro_ok');
      const banner = document.createElement('p');
      banner.textContent = '✅ Conta criada com sucesso! Faça login para continuar.';
      banner.style.cssText = 'color:#1a7a3c;background:#e6f9ee;border:1px solid #a3d9b1;padding:.7rem 1rem;border-radius:6px;font-size:.9rem;margin-bottom:1rem;';
      document.getElementById('form-login').prepend(banner);
    }

    async function fazerLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn   = document.querySelector('.btn-entrar');

      btn.disabled = true;
      btn.textContent = 'Aguarde…';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          const msg = data?.detail?.error || data?.detail || 'E-mail ou senha incorretos.';
          mostrarErro(msg);
          return;
        }
        /* Salva token e dados básicos — nunca a senha */
        localStorage.setItem('gd_token', data.access_token);
        localStorage.setItem('gd_user', JSON.stringify({
          id:       data.user.id,
          nome:     data.user.nome,
          email:    data.user.email,
          telefone: data.user.telefone,
          perfil:   data.user.perfil,
        }));
        window.location.href = 'inicialopcao.html';
      } catch (err) {
        mostrarErro('Erro de conexão. Tente novamente.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    function mostrarErro(msg) {
      let el = document.getElementById('msg-erro-login');
      if (!el) {
        el = document.createElement('p');
        el.id = 'msg-erro-login';
        el.style.cssText = 'color:#c0392b;font-size:.9rem;margin:.5rem 0 0;text-align:center;';
        document.querySelector('.btn-entrar').insertAdjacentElement('beforebegin', el);
      }
      el.textContent = msg;
    }

    function toggleSenha() {
      const input = document.getElementById('senha');
      const icone = document.getElementById('icon-olho');
      const vis = input.type === 'text';
      input.type = vis ? 'password' : 'text';
      icone.innerHTML = vis
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    }
  </script>

</body>
</html>

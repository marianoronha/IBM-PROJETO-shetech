
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico de testes - Guardião</title>

    
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../styles/historicotestes.css">
</head>

<body>

<div class="gd-app">

   

    <aside class="gd-side" id="gd-side">

        
        <button
            type="button"
            class="gd-collapse"
            id="gd-col"
            aria-label="Recolher menu">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 6-6 6 6 6"/>
            </svg>

        </button>

        <!-- LOGO -->
        <div class="gd-logo">

            <svg class="mk" viewBox="0 0 24 24" aria-hidden="true">

                <path
                    d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"
                    fill="#fcd116"/>

                <path
                    d="m8.5 12 2.6 2.6L16 9.7"
                    stroke="#002a63"
                    stroke-width="2.2"
                    fill="none"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

            </svg>

            <span class="gd-wm">
                Guardião<i></i>
            </span>

        </div>

    
        <nav class="gd-nav" aria-label="Menu principal">

            
            <a
                class="gd-item"
                href="inicialopcao.html"
                title="Início">

                <svg viewBox="0 0 24 24">
                    <path d="M3 11 12 3l9 8"/>
                    <path d="M5 10v10h14V10"/>
                    <path d="M10 20v-6h4v6"/>
                </svg>

                <span class="gd-lbl">Início</span>

            </a>

            <!-- GUARDIÃO -->
            <a
                class="gd-item"
                href="monitoramentoGuardiao.html"
                title="Guardião"
                aria-current="page">

                <svg viewBox="0 0 24 24">
                    <path d="M12 3 5 6v5c0 4.5 3 8.2 7 10 4-1.8 7-5.5 7-10V6z"/>
                    <path d="M12 8v5"/>
                    <path d="M12 16h.01"/>
                </svg>

                <span class="gd-lbl">Guardião</span>

            </a>

        
            <a
                class="gd-item"
                href="BBDecision.html"
                title="Decision">

                <svg viewBox="0 0 24 24">
                    <path d="M5 20V12"/>
                    <path d="M12 20V5"/>
                    <path d="M19 20v-9"/>
                </svg>

                <span class="gd-lbl">Decision</span>

            </a>

            <!-- PERFIL -->
            <a
                class="gd-item"
                href="perfil.html"
                title="Perfil">

                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>
                </svg>

                <span class="gd-lbl">Perfil</span>

            </a>

            
            <a
                class="gd-item gd-out"
                href="telainicial.html"
                title="Sair">

                <svg viewBox="0 0 24 24">
                    <path d="M10 4H5v16h5"/>
                    <path d="M9 12h11"/>
                    <path d="m16 8 4 4-4 4"/>
                </svg>

                <span class="gd-lbl">Sair</span>

            </a>

        </nav>

    </aside>



    <div class="gd-content">

        <main class="conteudo">

            <!-- CABEÇALHO -->
            <header class="cabecalho-pagina">

                <!-- BOTÃO VOLTAR -->
                <a
                    href="testegolpemensagem.html"
                    class="voltar"
                    aria-label="Voltar">

                    <svg viewBox="0 0 24 24">
                        <path d="M19 12H5"/>
                        <path d="M12 19L5 12L12 5"/>
                    </svg>

                </a>

                <h1>Histórico de testes</h1>

            </header>


          

            <section class="lista-historico">

                <!-- TESTE 1 -->
                <article class="item-historico">

                    <div class="icone-historico icone-golpe">

                        <img
                            src="../img/prancheta.png"
                            alt="Mensagem suspeita">

                    </div>

                    <div class="informacoes-teste">

                        <h2>Mensagem sobre prêmio</h2>

                        <p>25/10/2025 - 14:52</p>

                    </div>

                    <span class="classificacao golpe">
                        + Golpe
                    </span>

                </article>


                <!-- TESTE 2 -->
                <article class="item-historico">

                    <div class="icone-historico icone-seguro">

                        <img
                            src="../img/banco.png"
                            alt="Banco">

                    </div>

                    <div class="informacoes-teste">

                        <h2>Link de atualização de conta</h2>

                        <p>24/10/2025 - 11:28</p>

                    </div>

                    <span class="classificacao seguro">
                        É Seguro
                    </span>

                </article>


                <!-- TESTE 3 -->
                <article class="item-historico">

                    <div class="icone-historico icone-golpe">

                        <img
                            src="../img/link.png"
                            alt="Link suspeito">

                    </div>

                    <div class="informacoes-teste">

                        <h2>Falso suporte de banco</h2>

                        <p>20/10/2025 - 09:12</p>

                    </div>

                    <span class="classificacao golpe">
                        Golpe
                    </span>

                </article>


                <!-- TESTE 4 -->
                <article class="item-historico">

                    <div class="icone-historico icone-seguro">

                        <img
                            src="../img/mensagem.png"
                            alt="Mensagem">

                    </div>

                    <div class="informacoes-teste">

                        <h2>Promoção imperdível</h2>

                        <p>18/10/2025 - 16:45</p>

                    </div>

                    <span class="classificacao seguro">
                        É Seguro
                    </span>

                </article>

            </section>

        </main>

    </div>

</div>




<!-- FUNCIONAMENTO DO MENU LATERAL -->
<script src="../js/menu.js"></script>

<!-- CHATBOT -->
<script src="../js/chatbot.js" defer></script>

</html>
